###############################################
#                DISBOT SUPPORT               #
#---------------------------------------------#
# Discord:  https://discord.gg/E2hAAa7F6q     #
###############################################

# Bot token (required — it is necessary to restart the server after changing)
discord-token: "TOKEN-HERE"

# Bot name (used in the help embed title)
bot-name: "DisBot"

# Command prefix (used for prefix commands; leave empty to use slash commands only)
command-prefix: "db!"

# Allowed channels (channel IDs); leave empty to allow all channels
# Example:
# allowed-channels:
#   - "123456789012345678"
#   - "987654321098765432"
allowed-channels: []

# Server channel IDs (channel IDs where Minecraft messages will be sent)
server-channel-id:
  - "YOUR_CHANNEL_ID_HERE"
  - "YOUR_CHANNEL_ID_HERE"

# Message sent when a player joins the server (leave empty to disable)
join-embed-message: "**{username}** has joined the server!"

# Color of the join embed (hexadecimal format, e.g., #57F287)
join-embed-color: "#57F287"

# Thumbnail of the join embed (optional, leave empty to not display any)
join-embed-thumbnail: ""

# Message sent when a player leaves the server (leave empty to disable)
leave-embed-message: "**{username}** has left the server!"

# Color of the leave embed (hexadecimal format, e.g., #ED4245)
leave-embed-color: "#ED4245"

# Thumbnail of the leave embed (optional, leave empty to not display any)
leave-embed-thumbnail: ""

# Message format for Discord (used for messages sent from Discord to Minecraft)
discord-to-minecraft-format: "&9[&bDC]&9 {role}  &c{username} &1> &f{message}"

# Minecraft message format (used for messages sent from Minecraft to Discord)
minecraft-to-discord-format: "**{luckperms_prefix} {username}:** {message}"